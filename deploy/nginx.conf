# Sert le site statique Super Génial sur le VPS Semisto (Coolify).
server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Derrière Traefik + Cloudflare (TLS terminé en amont) : redirections relatives
    # pour garder le scheme et l'hôte réels.
    absolute_redirect off;

    # Canonique = www. L'apex redirige en 301 ; un autre hôte (sous-domaine d'essai) est servi tel quel.
    if ($host = "supergenial.be") { return 301 https://www.supergenial.be$request_uri; }

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml;

    # Assets non hashés : cache d'une semaine.
    location ^~ /assets/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/index.html $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
